name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint backend
        run: npm run lint

      - name: Run backend unit tests with coverage
        run: npm run test:coverage

      - name: Build backend
        run: npm run build

      - name: Audit backend dependencies
        run: npm audit --audit-level=high

  backend-e2e:
    name: Backend E2E
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: 3000
      API_PREFIX: api/v1
      CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mr_clean_test
      DATABASE_SSL: "false"
      DATABASE_POOL_MAX: 5
      JWT_ACCESS_SECRET: ci-only-signing-secret-not-used-outside-tests
      JWT_ACCESS_ISSUER: mr-clean-api
      JWT_ACCESS_AUDIENCE: mr-clean-admin
      JWT_ACCESS_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_DAYS: 30
      REFRESH_TOKEN_ABSOLUTE_TTL_DAYS: 45
      ADMIN_MAX_FAILED_LOGINS: 5
      ADMIN_LOCKOUT_MINUTES: 15
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: lax
      AWS_ENDPOINT_URL: https://storage.invalid
      AWS_ACCESS_KEY_ID: ci-access-key
      AWS_SECRET_ACCESS_KEY: ci-secret-key-not-used-outside-tests
      AWS_S3_BUCKET_NAME: ci-product-images
      AWS_DEFAULT_REGION: auto
      AWS_S3_URL_STYLE: path
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mr_clean_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mr_clean_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build migration artifacts
        run: npm run build

      - name: Migrate ephemeral database
        run: npm run db:migrate

      - name: Run backend end-to-end tests
        run: npm run test:e2e
